<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track-a-Peso - Expense and Budget Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Track-a-Peso</h1>
    <button id="addTxBtn" class="btn primary" type="button">Add transaction</button>
  </header>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <main class="page">
    <!-- Dashboard -->
    <section class="overview" aria-label="Overview">
      <div class="balance">
        <p class="small">Total balance</p>
        <p id="totalBalance" class="big">&mdash;</p>
        <p id="countsLine" class="small"></p>
      </div>

      <div class="month">
        <div class="month-head">
          <label for="monthPicker" class="small">Month</label>
          <input type="month" id="monthPicker">
        </div>
        <dl class="stats">
          <div><dt>Income</dt><dd id="monthIncome" class="pos">&mdash;</dd></div>
          <div><dt>Expenses</dt><dd id="monthExpense" class="neg">&mdash;</dd></div>
          <div><dt>Net</dt><dd id="monthNet">&mdash;</dd></div>
        </dl>
        <div class="split" aria-hidden="true"><span id="splitIncome"></span><span id="splitExpense"></span></div>
      </div>
    </section>

    <div class="columns">
      <!-- Transactions -->
      <section class="panel ledger" aria-labelledby="txHeading">
        <div class="panel-head">
          <h2 id="txHeading">Transactions</h2>
          <p id="txSummary" class="small"></p>
        </div>

        <form id="filters" class="filters" autocomplete="off">
          <label class="field grow"><span>Search</span>
            <input type="search" id="fSearch" placeholder="Description or note">
          </label>
          <label class="field"><span>Type</span>
            <select id="fType">
              <option value="">All</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </label>
          <label class="field"><span>Category</span><select id="fCategory"></select></label>
          <label class="field"><span>Account</span><select id="fAccount"></select></label>
          <label class="field"><span>From</span><input type="date" id="fFrom"></label>
          <label class="field"><span>To</span><input type="date" id="fTo"></label>
          <button type="button" id="clearFilters" class="btn ghost">Clear filters</button>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Account</th>
                <th class="num">Amount</th>
                <th class="num">Balance</th>
                <th><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
        <p id="txEmpty" class="empty" hidden></p>
      </section>

      <!-- Sidebar -->
      <aside class="side">
        <section class="panel" aria-labelledby="accHeading">
          <div class="panel-head">
            <h2 id="accHeading">Accounts</h2>
            <button type="button" class="btn small-btn" id="addAccountBtn">Add account</button>
          </div>
          <ul id="accountList" class="list"></ul>
        </section>

        <section class="panel" aria-labelledby="catHeading">
          <div class="panel-head">
            <h2 id="catHeading">Categories</h2>
            <button type="button" class="btn small-btn" id="addCategoryBtn">Add category</button>
          </div>
          <ul id="categoryList" class="list"></ul>
        </section>

        <section class="panel" aria-labelledby="spendHeading">
          <div class="panel-head"><h2 id="spendHeading">Spending this month</h2></div>
          <ul id="spendList" class="bars"></ul>
        </section>
      </aside>
    </div>
  </main>

  <!-- Add / edit transaction -->
  <dialog id="txDialog">
    <form id="txForm" novalidate>
      <h2 id="txDialogTitle">Add transaction</h2>
      <p id="txError" class="form-error" role="alert" hidden></p>

      <div class="segmented" role="radiogroup" aria-label="Transaction type">
        <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
        <label><input type="radio" name="type" value="income"><span>Income</span></label>
      </div>

      <div class="row">
        <label class="field"><span>Amount</span>
          <input type="number" name="amount" step="0.01" min="0.01" inputmode="decimal" required>
        </label>
        <label class="field"><span>Date</span>
          <input type="date" name="date" required>
        </label>
      </div>

      <label class="field"><span>Description</span>
        <input type="text" name="description" maxlength="100" required>
      </label>

      <div class="row">
        <label class="field"><span>Account</span><select name="account" required></select></label>
        <label class="field"><span>Category</span><select name="category" required></select></label>
      </div>

      <label class="field"><span>Note (optional)</span>
        <input type="text" name="note" maxlength="200">
      </label>

      <div class="actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="txSubmit">Save transaction</button>
      </div>
    </form>
  </dialog>

  <!-- Add / edit account or category -->
  <dialog id="entityDialog">
    <form id="entityForm" novalidate>
      <h2 id="entityTitle"></h2>
      <p id="entityError" class="form-error" role="alert" hidden></p>

      <label class="field"><span>Name</span>
        <input type="text" name="name" maxlength="60" required>
      </label>
      <label class="field"><span id="entityTypeLabel">Type</span>
        <select name="type" required></select>
      </label>
      <label class="field" id="openingField"><span>Opening balance</span>
        <input type="number" name="openingBalance" step="0.01" value="0">
      </label>

      <div class="actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="entitySubmit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
